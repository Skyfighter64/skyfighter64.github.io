<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {%- seo -%}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
      {%- include google-analytics.html -%}
    {%- endif -%}

    {%- include custom-head.html -%}  <!-- 👈 Your KaTeX CSS goes here -->
  </head>

  <body>
    <header class="site-header">
      {%- include header.html -%}
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      {%- include footer.html -%}
    </footer>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
  integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
  crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
  crossorigin="anonymous"
  onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false},
      {left: '\\[', right: '\\]', display: true}
    ]
  });"></script>

  <div id="shared-lightbox" class="shared-lightbox"
     role="dialog" aria-modal="true"
     aria-label="Enlarged image">
  <button type="button" class="lightbox-close"
          aria-label="Close enlarged image">&times;</button>
  <img src="" alt="">
</div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const lightbox = document.getElementById("shared-lightbox");
    const enlargedImage = lightbox.querySelector("img");
    const closeButton = lightbox.querySelector(".lightbox-close");

    // Open any gallery or rounded image when clicked
    document.querySelectorAll(".image-gallery img:not(.no-lightbox), img.rounded-image:not(.no-lightbox)").forEach(function (thumbnail) {
        thumbnail.addEventListener("click", function () {
          enlargedImage.src = thumbnail.currentSrc || thumbnail.src;
          enlargedImage.alt = thumbnail.alt || "Enlarged image";
          lightbox.classList.add("is-open");
          document.body.style.overflow = "hidden";
          closeButton.focus();
        });
      });

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      enlargedImage.src = "";
      document.body.style.overflow = "";
    }

    closeButton.addEventListener("click", closeLightbox);

    // Close when clicking the dark background
    lightbox.addEventListener("click", function (event) {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    // Close with Escape
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
        closeLightbox();
      }
    });
  });
  </script>
  </body>
</html>
